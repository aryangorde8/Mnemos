name: deploy

# Production deploy, triggered by a green `ci` run on main.
#
# Runs on a self-hosted runner living on the Lightsail box rather than SSHing in from
# a GitHub runner. The box holds users' Google refresh tokens, and reaching it from
# GitHub's hosted runners would mean opening port 22 to their whole published IP range.
# A self-hosted runner dials out instead, so nothing new is exposed.
#
# `workflow_run` fires only after `ci` finishes, so a commit that fails the import
# check or the image build never reaches production.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deploy midway — a half-applied rebuild is worse than a queued one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  production:
    name: lightsail (production)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, mnemos]
    timeout-minutes: 25
    steps:
      - name: sync working tree to origin/main
        # reset rather than pull: the box is a deploy target, not somewhere to edit, and
        # a local commit or conflict should not be able to wedge a deploy. .env is
        # untracked and gitignored, so it survives this.
        run: |
          set -euo pipefail
          cd ~/Mnemos
          git fetch --prune origin main
          git reset --hard origin/main
          git log --oneline -1

      - name: rebuild app containers
        # caddy is left alone: its config is unchanged by app commits, and restarting it
        # needlessly drops TLS connections and risks an ACME rate limit.
        run: |
          set -euo pipefail
          cd ~/Mnemos/deploy/aws
          docker compose up -d --build web agent

      - name: wait for the site to answer
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://mnemos.aryangorde.com/ || echo 000)
            if [ "$code" = "200" ]; then echo "home page 200 after ${i} attempt(s)"; exit 0; fi
            sleep 5
          done
          echo "home page never returned 200 — check: docker compose logs --tail 100 web"
          exit 1

      - name: reclaim disk from replaced images
        # Untagged layers from every previous build otherwise fill a small disk and the
        # next build fails with no space left.
        if: always()
        run: docker image prune -f
